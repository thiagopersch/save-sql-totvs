services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: totvs-app
    restart: always
    ports:
      - '3333:3333'

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: totvs
      POSTGRES_DATABASE: totvs

    depends_on:
      - db

    networks:
      - totvs-network

  db:
    image: postgres:latest
    command: [ 'postgres', '-c', 'log_statement=all' ]
    container_name: postgres
    restart: always
    healthcheck:
      test: [ 'CMD', 'pg_isready', '-U', 'postgres', '-d', 'postgres' ]
      interval: 5s
      retries: 10

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: totvs
      POSTGRES_DB: totvs

    ports:
      - '5432:5432'

    volumes:
      - ./initdb:/docker-entrypoint-initdb.d

    networks:
      - totvs-network

volumes:
  postgres-data:


networks:
  totvs-network:
    driver: bridge
